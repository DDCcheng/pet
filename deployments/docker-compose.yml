services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pet
      MYSQL_DATABASE: pet
    ports:
      - "3307:3306"
    volumes:
      # 只在数据卷第一次初始化时执行；老容器要 docker compose down 后再 up
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppet"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PET_MYSQL_DSN: "root:pet@tcp(mysql:3306)/pet?parseTime=true&charset=utf8mb4"
      PET_REDIS_ADDR: "redis:6379"
      # /login 每个 IP 每秒几次。压测时所有 bot 来自同一个 IP，用 PET_LOGIN_RATE=0 docker compose up -d 关掉
      PET_LOGIN_RATE: "${PET_LOGIN_RATE:-1}"
      # 浏览器前端的来源，逗号分隔，例如 http://localhost:5173；不填只允许同源
      PET_ALLOWED_ORIGINS: "${PET_ALLOWED_ORIGINS:-}"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
